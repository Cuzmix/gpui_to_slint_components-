name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Slint widget library (on the clean checkout, before anything is built)
        run: |
          if grep -r "std""-widgets" .; then exit 1; fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - name: Slint tools 1.18.1
        run: cargo install slint-lsp@1.18.1 slint-viewer@1.18.1 --locked
      - name: All checks
        run: ./scripts/check.sh
