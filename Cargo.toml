[package]
name = "ely-slint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Ely components ported from Ely-GPUI-Components to Slint 1.18.1, with an optional Rust support crate."
build = "build.rs"
include = ["src/**", "ui/**", "build.rs", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
emojis = "0.9"
iso_currency = "0.7"
jiff = "0.2"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
png = "0.18"
i-slint-backend-testing = "=1.18.1"

# Keep the debug tree small: line tables are enough for backtraces, and incremental caches
# of the generated Slint code run to gigabytes.
[profile.dev]
debug = "line-tables-only"
incremental = false
