[package]
name = "ely-slint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Ely components ported from Ely-GPUI-Components to Slint 1.18.1, with an optional Rust support crate."
build = "build.rs"
include = ["src/**", "ui/**", "build.rs", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
emojis = "0.9"
iso_currency = "0.7"
jiff = "0.2"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[features]
# The tray icon and the Dock badge (`ely_slint::desktop`).
desktop = ["dep:futures", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:windows", "dep:image", "dep:zbus"]

[target.'cfg(target_os = "linux")'.dependencies]
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSDockTile",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"], optional = true }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
png = "0.18"
i-slint-backend-testing = "=1.18.1"

# Keep the debug tree small: line tables are enough for backtraces, and incremental caches
# of the generated Slint code run to gigabytes.
[profile.dev]
debug = "line-tables-only"
incremental = false
